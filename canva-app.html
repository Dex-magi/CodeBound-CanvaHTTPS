<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codebound Canva App</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #gameFrame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }
  </style>
</head>
<body>
  <iframe
    id="gameFrame"
    src="https://your-game-url-here.com/index.html?canva=1"
    title="Codebound Java Edition"
    allowfullscreen
  ></iframe>

  <script>
    const frame = document.getElementById('gameFrame');

    window.addEventListener('message', (event) => {
      if (!event.data || typeof event.data !== 'object') return;

      if (event.data.type === 'codebound:ready') {
        const height = Math.max(700, Number(event.data.height) || 700);
        frame.style.height = height + 'px';
        window.parent.postMessage({
          type: 'canva:resize',
          height: height
        }, '*');
      }
    });

    window.parent.postMessage({ type: 'canva:ready' }, '*');
  </script>
</body>
</html>
